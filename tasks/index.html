<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Requirement 1: Heading -->
  <h1>Interactive To Do List</h1>

  <!-- Requirement 2: List using <ul> -->
  <ul class="todo-list">
    <li>
      <span>Complete Module 2 Challenge</span>
      <!-- Requirement 4: Check icon on the right -->
      <img src="square-check-regular-full.svg" class="check-icon" alt="Check icon">
    </li>
    <li>
      <span>Push code to GitHub repository</span>
      <img src="square-check-regular-full.svg" class="check-icon" alt="Check icon">
    </li>
    <li>
      <span>Open Pull Request and tag mentor</span>
      <img src="square-check-regular-full.svg" class="check-icon" alt="Check icon">
    </li>
  </ul>

  <script src="script.js"></script>
</body>
</html>
